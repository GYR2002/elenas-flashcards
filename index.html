<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elena’s Flashcards</title>
<style>
  :root {
    --bg: #f6f4ef; --surface: #ffffff; --surface-2: #faf8f4; --text: #1f2328; --muted: #6b7280;
    --border: #e3dfd6; --accent: #3b6e5a; --accent-hover: #325e4d; --accent-text: #ffffff;
    --danger: #b42318; --again: #c2410c; --hard: #b45309; --good: #3b6e5a; --easy: #2563eb;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171b; --surface: #1f2228; --surface-2: #1a1d22; --text: #e8e6e3; --muted: #9aa0a8;
      --border: #2e323a; --accent: #6fb393; --accent-hover: #82c3a4; --accent-text: #0f1512;
      --danger: #f07167; --again: #f08a5d; --hard: #e0a44a; --good: #6fb393; --easy: #7aa7f5;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 760px; margin: 0 auto; padding: 24px 16px 24px; }
  #savebar { max-width: 760px; margin: 0 auto; padding: 0 16px 40px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 1.75rem; margin: 0; letter-spacing: -.01em; overflow-wrap: anywhere; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: .875rem; }
  code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }

  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 20px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  nav { display: flex; justify-content: space-between; align-items: center; min-height: 32px; }

  .btn {
    font: inherit; font-weight: 600; font-size: .95rem; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 9px 16px; border-radius: 10px; transition: background .15s, border-color .15s;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 6px 12px; font-size: .875rem; }
  .btn.big { width: 100%; padding: 14px; font-size: 1.05rem; }
  .link { font: inherit; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; font-weight: 600; }
  .icon { font: inherit; font-size: .8rem; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 6px; }
  .icon:hover { background: var(--surface-2); color: var(--text); }
  .icon.danger:hover { color: var(--danger); }

  input, textarea, select {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; width: 100%;
  }
  textarea { resize: vertical; }
  select { width: auto; padding: 6px 10px; }
  input:focus, textarea:focus, select:focus, .flip:focus-visible, .btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .row-form { display: flex; gap: 8px; margin-bottom: 20px; }
  .row-form input { flex: 1; }
  .card-form { display: grid; gap: 8px; }
  .card-form .btn { justify-self: start; }

  .list { display: grid; gap: 8px; }
  .deck-row {
    font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px;
    box-shadow: var(--shadow); transition: border-color .15s, transform .15s;
  }
  .deck-row:hover { border-color: var(--accent); }
  .deck-name { font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; }
  .deck-meta { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  .due { color: var(--accent); }
  .empty { text-align: center; padding: 40px 16px; border: 1px dashed var(--border); border-radius: 14px; }
  .empty p { margin: 4px 0; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .stats > * { background: var(--surface-2); border-radius: 10px; padding: 10px; text-align: center; }
  .stats button { font: inherit; color: inherit; border: 2px solid transparent; cursor: pointer; }
  .stats button:hover { border-color: var(--border); }
  .stats button[aria-pressed="true"] { border-color: var(--accent); }
  .stats b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--muted); font-size: .85rem; }
  .study-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .study-actions .btn { flex: 1; min-width: 150px; }
  .dir { font-size: .9rem; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }

  details { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  details textarea { font-family: ui-monospace, Menlo, monospace; font-size: .9rem; }
  .bulk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .bulk-bar .spacer { flex: 1; }
  .bulk-bar label { font-size: .9rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }

  .list-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .list-head h2 { margin: 0; }
  .list-head input { max-width: 220px; padding: 6px 10px; }
  .card-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .card-row:first-child { border-top: 0; }
  .card-row.editing { display: grid; gap: 8px; }
  .cr-text { min-width: 0; }
  .cr-front { font-weight: 600; overflow-wrap: anywhere; }
  .cr-back { color: var(--muted); font-size: .92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cr-side { display: flex; align-items: flex-start; gap: 2px; flex-shrink: 0; }
  .cr-side .tag { font-size: .78rem; color: var(--muted); padding: 4px 6px; white-space: nowrap; }
  .row-actions { display: flex; gap: 8px; }

  .progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin: 8px 0 4px; }
  .progress div { height: 100%; background: var(--accent); transition: width .3s; }
  .progress.tall { height: 10px; border-radius: 5px; margin: 0 0 14px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .panel-head h2 { margin: 0; }
  .panel p { margin: 0 0 12px; }
  .skip-row { text-align: center; margin-top: 8px; }
  .flip { perspective: 1400px; cursor: pointer; margin: 16px 0; border-radius: 18px; }
  .flip-inner { position: relative; height: min(58vh, 400px); min-height: 240px; transition: transform .5s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
  .flip-inner.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 24px; text-align: center; overflow: auto;
  }
  .face.back { transform: rotateY(180deg); background: var(--surface-2); }
  .face-label { position: absolute; top: 14px; left: 18px; right: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .face-text { font-size: 2.1rem; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 100%; }
  .face-text.md { font-size: 1.5rem; }
  .face-text.sm { font-size: 1.15rem; font-weight: 500; }
  .face-text.xs { font-size: 1rem; font-weight: 400; text-align: left; }
  .hint { position: absolute; bottom: 14px; font-size: .8rem; color: var(--muted); }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .controls .btn { flex: 1; }
  .rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .rate .btn { padding: 10px 4px; display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
  .rate .btn small { font-weight: 400; color: var(--muted); font-size: .78rem; }
  .rate .hard { color: var(--hard); }
  .rate .good { color: var(--good); } .rate .easy { color: var(--easy); }
  .keys { text-align: center; margin-top: 12px; }
  .done { text-align: center; padding: 48px 16px; }
  .done .big-emoji { font-size: 3rem; }
  .done .actions { justify-content: center; margin-top: 20px; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px;
    font-size: .92rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    max-width: calc(100% - 32px); text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }

  /* deck results */
  .panel h3 { font-size: .95rem; margin: 20px 0 8px; }
  .rt::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 1px; }
  .rt.hard::before { background: var(--hard); }
  .rt.good::before { background: var(--good); } .rt.easy::before { background: var(--easy); }
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 96px; border-bottom: 1px solid var(--border); }
  .day { flex: 1; height: 100%; display: flex; align-items: flex-end; border-radius: 4px; outline-offset: 2px; cursor: default; }
  .day:hover, .day:focus-visible { background: var(--surface-2); }
  .bar { width: 100%; min-height: 3px; display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 4px 4px 0 0; overflow: hidden; }
  .seg { display: block; min-height: 2px; }
  .seg.right, .sw.right { background: var(--good); }
  .seg.miss, .sw.miss { background: repeating-linear-gradient(135deg, var(--again) 0 3px, color-mix(in srgb, var(--again) 55%, var(--surface)) 3px 5px); }
  .chart-x { display: flex; justify-content: space-between; margin: 4px 0 6px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 0 0 4px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  #day-readout { min-height: 1.3em; margin: 0; }
  .word-list { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
  .word-list li { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; background: var(--surface-2); border-radius: 10px; padding: 8px 12px; }
  .word-list .w { font-weight: 600; } .word-list .d { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
  .word-list .n { color: var(--muted); font-size: .8rem; white-space: nowrap; }
  .word-list.scroll { max-height: 340px; overflow-y: auto; }
  .word-list .ok { color: var(--good); font-weight: 600; }
  details.daily-words { margin-top: 14px; }
  details.daily-words .word-list { margin-top: 10px; }

  /* daily challenge + toilet buddy */
  .daily-row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  .daily-row .panel { flex: 1; min-width: 0; margin: 0; }
  .loo { flex: none; width: 128px; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .loo svg { display: block; width: 100%; height: auto; aspect-ratio: 130 / 150; overflow: visible; }
  .loo figcaption { font-size: .78rem; color: var(--muted); text-align: center; }
  .loo .ln { fill: none; stroke: var(--text); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .loo .fx { fill: none; stroke: var(--text); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .loo .porc { fill: var(--surface); stroke: var(--muted); stroke-width: 2; }
  .loo .headfill { fill: var(--surface); }
  .loo .flush { fill: #e5484d; opacity: calc(var(--s) * .55); }
  .loo .poo { fill: #8b5a2b; }
  .loo .drop { fill: #5aa9e6; }
  .loo .say { font: italic 700 10px system-ui, sans-serif; fill: var(--muted); }
  .loo .face-strain, .loo .face-done, .loo .sweat, .loo .hnng, .loo .win { display: none; }
  .loo.is-strain .face-calm, .loo.is-done .face-calm { display: none; }
  .loo.is-strain .face-strain, .loo.is-done .face-done, .loo.is-done .win { display: inline; }
  .loo.is-sweaty .sweat, .loo.is-hnngy .hnng { display: inline; }
  .loo .guy { transform-box: view-box; transform-origin: 54px 90px; }
  .loo.is-strain .guy { animation: loo-shake calc(.7s - .5s * var(--s)) linear infinite; }
  .loo .sweat path { animation: loo-drip 1.4s ease-in infinite; } .loo .sweat path + path { animation-delay: .7s; }
  .loo.is-hnngy .hnng { animation: loo-pulse .8s ease-in-out infinite; }
  .loo .poo-g { animation: loo-drop .7s cubic-bezier(.5, 0, .8, .4) .4s both; }
  .loo .splash { animation: loo-splash .6s ease-out 1.05s both; }
  .loo .ahh { animation: loo-pop .4s ease-out 1.3s both; transform-box: fill-box; transform-origin: center; }
  @keyframes loo-shake { 0%, 100% { transform: translateX(0) } 25% { transform: translateX(calc(-.4px - 1.6px * var(--s))) rotate(calc(-1deg * var(--s))) } 75% { transform: translateX(calc(.4px + 1.6px * var(--s))) } }
  @keyframes loo-drip { 0% { transform: translateY(0); opacity: 0 } 20% { opacity: 1 } 100% { transform: translateY(14px); opacity: 0 } }
  @keyframes loo-pulse { 50% { opacity: .35 } }
  @keyframes loo-drop { from { transform: translateY(-22px); opacity: 0 } 25% { opacity: 1 } to { transform: translateY(0); opacity: 1 } }
  @keyframes loo-splash { 0% { transform: translateY(6px); opacity: 0 } 40% { opacity: 1 } 100% { transform: translateY(-8px); opacity: 0 } }
  @keyframes loo-pop { from { transform: scale(0); opacity: 0 } to { transform: scale(1); opacity: 1 } }

  /* missed days: 1 = red and sweating from the start, 2 = purple, bulging eyes, bloated */
  .loo .belly, .loo .face-bulge, .loo .face-dead, .loo .grave, .loo .ghost, .loo .argh, .loo .super { display: none; }
  .loo.m2 .face-strain { display: none; }
  .loo.m2 .face-bulge, .loo.m2 .belly { display: inline; }
  .loo.m2 .flush { fill: #8e4ec6; }
  /* dead: gravestone + ghost. The first time, he dies on screen */
  .loo.is-dead .guy, .loo.is-dead .win { display: none; }
  .loo.is-dead .grave, .loo.is-dead .ghost { display: inline; }
  .loo .grave, .loo .ghost { transform-box: view-box; }
  .loo.is-dead .ghost { animation: loo-float 2.4s ease-in-out infinite; }
  .loo.is-dying .guy { display: inline; animation: loo-agony .09s linear 20, loo-fall .7s ease-in 1.8s forwards, loo-vanish .5s 3s forwards; }
  .loo.is-dying .flush { fill: #e5484d; opacity: .9; }
  .loo.is-dying .face-calm, .loo.is-dying .face-strain { display: none; }
  .loo.is-dying .belly, .loo.is-dying .sweat { display: inline; }
  .loo.is-dying .face-bulge { display: inline; animation: loo-off 0s 1.8s forwards; }
  .loo.is-dying .face-dead { display: inline; visibility: hidden; animation: loo-on 0s 1.8s forwards; }
  .loo.is-dying .argh { display: inline; animation: loo-pulse .3s 6, loo-off 0s 1.8s forwards; }
  .loo.is-dying .grave { animation: loo-rise .6s ease-out 3.2s both; }
  .loo.is-dying .ghost { animation: loo-appear .6s 3.8s both, loo-float 2.4s ease-in-out 3.8s infinite; }
  /* revived: flies out of the toilet like Superman, loops, lands back on the seat */
  .loo.is-revive .super { display: inline; transform-box: view-box; transform-origin: 0 0; animation: loo-fly 2.2s cubic-bezier(.4, 0, .6, 1) both; }
  .loo .cape { fill: #e5484d; transform-box: fill-box; transform-origin: right center; animation: loo-cape .15s ease-in-out infinite alternate; }
  .loo.is-revive .guy { animation: loo-land .45s cubic-bezier(.3, 1.5, .5, 1) 2.1s both; }
  .loo.is-revive .poo-g { animation-delay: 2.8s; } .loo.is-revive .splash { animation-delay: 3.45s; } .loo.is-revive .ahh { animation-delay: 3.7s; }
  @keyframes loo-agony { 0%, 100% { transform: none } 25% { transform: translate(-2.5px, 1px) rotate(-4deg) } 75% { transform: translate(2.5px, -1px) rotate(4deg) } }
  @keyframes loo-fall { to { transform: rotate(35deg) translateY(4px) } }
  @keyframes loo-vanish { to { opacity: 0 } }
  @keyframes loo-off { to { visibility: hidden } }
  @keyframes loo-on { to { visibility: visible } }
  @keyframes loo-rise { from { transform: translateY(40px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes loo-appear { from { opacity: 0 } }
  @keyframes loo-float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @keyframes loo-cape { from { transform: scaleY(.7) } to { transform: scaleY(1.15) } }
  @keyframes loo-land { from { transform: translateY(-40px); opacity: 0 } 60% { transform: translateY(2px); opacity: 1 } to { transform: none; opacity: 1 } }
  @keyframes loo-fly {
    0% { transform: translate(58px, 112px) rotate(-90deg) scale(.3); opacity: 0 }
    10% { transform: translate(58px, 86px) rotate(-90deg) scale(.9); opacity: 1 }
    35% { transform: translate(62px, 14px) rotate(-75deg) scale(1) }
    55% { transform: translate(104px, 18px) rotate(0deg) scale(1) }
    75% { transform: translate(98px, 56px) rotate(90deg) scale(1) }
    90% { transform: translate(70px, 40px) rotate(200deg) scale(.9); opacity: 1 }
    100% { transform: translate(56px, 30px) rotate(250deg) scale(.7); opacity: 0 }
  }

  /* streak */
  .streak-line { margin: -2px 0 10px; font-size: .9rem; }
  .streak-line.warn { color: var(--danger); font-weight: 600; }
  .overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; }
  .backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); animation: loo-appear .2s both; }
  .pop { position: relative; background: var(--surface); border-radius: 18px; padding: 24px 22px 20px; width: min(360px, 100%); text-align: center; box-shadow: var(--shadow); animation: pop-in .4s cubic-bezier(.2, 1.4, .4, 1) both; }
  .pop h2 { font-size: 1.4rem; margin: 4px 0 6px; }
  .pop p { margin: 6px 0; }
  .pop .flame { font-size: 3rem; display: inline-block; animation: flame .6s ease-in-out infinite alternate; }
  .pop .count { display: inline-block; animation: pop-in .5s cubic-bezier(.2, 1.6, .4, 1) .5s both; }
  .streak-bar { height: 14px; border-radius: 7px; background: var(--border); overflow: hidden; margin: 16px 0 4px; }
  .streak-bar div { height: 100%; border-radius: 7px; background: linear-gradient(90deg, #f59e0b, #ef4444); animation: streak-fill 1.1s cubic-bezier(.3, .8, .3, 1) .4s both; }
  .streak-scale { display: flex; justify-content: space-between; margin-bottom: 14px; }
  @keyframes streak-fill { from { width: var(--from) } to { width: var(--to) } }
  @keyframes pop-in { from { transform: scale(.4); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  @keyframes flame { from { transform: scale(1) rotate(-4deg) } to { transform: scale(1.12) rotate(4deg) } }

  @media (max-width: 520px) {
    .loo { width: 92px; }
    h1 { font-size: 1.45rem; }
    .row-form { flex-direction: column; }
    .face-text { font-size: 1.7rem; }
    .rate .btn { font-size: .85rem; }
    .list-head input { max-width: 140px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flip-inner, .progress div, #toast { transition: none; }
    .loo *, .pop, .pop *, .backdrop { animation: none !important; }
    .streak-bar div { width: var(--to); }
    .loo.is-dying .guy, .loo.is-revive .super { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<footer id="savebar">
  <span id="save-status" class="muted small">Autosaves every 3 min</span>
  <button class="btn ghost small" id="save-now" title="Save now (Ctrl/Cmd+S)">Save now</button>
</footer>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-json" accept=".json,application/json" class="hidden">
<input type="file" id="file-list" accept=".csv,.txt,.tsv,text/csv,text/plain" class="hidden">

<script>
/* ---------- storage ---------- */
const KEY = 'elena-flashcards-v1';
const DAY = 86400000;
let db = { decks: [], cards: [], settings: { dir: 'fw' }, daily: null, log: {}, streak: { done: [], since: null } };

function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      const d = JSON.parse(s);
      db = { decks: d.decks || [], cards: (d.cards || []).map(normCard), settings: { dir: 'fw', ...(d.settings || {}) }, daily: d.daily || null, log: d.log || {},
        streak: { done: [], since: null, ...(d.streak || {}) } };
    }
  } catch (e) { /* start empty */ }
}

const AUTOSAVE_MS = 3 * 60 * 1000;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const deck = id => db.decks.find(d => d.id === id);
const card = id => db.cards.find(c => c.id === id);
const cardsOf = deckId => db.cards.filter(c => c.deckId === deckId);
const isDue = (c, now = Date.now()) => c.due <= now;

function newCard(deckId, front, back) {
  return { id: uid(), deckId, front, back, created: Date.now(), due: Date.now(), interval: 0, ease: 2.5, reps: 0, lapses: 0, r: [0, 0, 0, 0] };
}
function normCard(c) {
  return {
    id: String(c.id), deckId: String(c.deckId), front: String(c.front ?? ''), back: String(c.back ?? ''),
    created: +c.created || Date.now(), due: +c.due || Date.now(), interval: +c.interval || 0,
    ease: +c.ease || 2.5, reps: +c.reps || 0, lapses: +c.lapses || 0,
    // answers so far as [Again, Hard, Good, Easy], from every kind of test; older saves are seeded from their miss counts
    r: Array.isArray(c.r) && c.r.length === 4 ? c.r.map(x => +x || 0)
      : [(+c.lapses || 0) + Math.round(+c.pMiss || 0), 0, (+c.reps || 0) + Math.max(0, (+c.pSeen || 0) - Math.round(+c.pMiss || 0)), 0],
  };
}

/* ---------- scheduling ---------- */
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };

// r: 1 = Hard (again in this session), 2 = Good (tomorrow), 3 = Easy (in 3 days).
// 0 = Again only appears in older saves and is treated like Hard.
const GAP = [0, 0, 1, 3];
function schedule(c, r, now = Date.now()) {
  c.interval = GAP[r];
  if (r <= 1) { c.lapses++; c.reps = 0; c.due = now; }
  else { c.reps++; c.due = startOfDay(now) + c.interval * DAY; }
  return c;
}
function fmtDays(d) {
  if (d < 1) return 'now';
  if (d === 1) return '1 day';
  if (d < 30) return d + ' days';
  if (d < 365) return +(d / 30).toFixed(1) + ' mo';
  return +(d / 365).toFixed(1) + ' yr';
}
const relDays = t => Math.round((startOfDay(t) - startOfDay(Date.now())) / DAY);
/* ---------- practice: daily challenge & random tests (never change the review schedule) ---------- */
const DAILY_SIZE = 30;
const todayStr = () => new Date().toLocaleDateString('sv'); // local YYYY-MM-DD
const sum = a => a.reduce((x, y) => x + y, 0);
const misses = c => c.r[0] + c.r[1]; // Hard (and the old Again) = missed
// Share of misses, smoothed so an unseen card scores 0.5
const weakness = c => (misses(c) + 1) / (sum(c.r) + 2);
// Words missed more often than got right; 5% of the deck (at least 1)
const troubleCards = cs => cs.filter(c => misses(c) >= 1 && weakness(c) > 0.5)
  .sort((a, b) => weakness(b) - weakness(a) || misses(b) - misses(a))
  .slice(0, Math.max(1, Math.round(cs.length * 0.05)));

function record(c, r) {
  c.r[r]++;
  const L = db.log[c.deckId] ??= {};
  (L[todayStr()] ??= [0, 0, 0, 0])[r]++;
}
const weakestFirst = cs => shuffle(cs.slice()).sort((a, b) => weakness(b) - weakness(a));

// Today's 30 words, weakest first; fixed for the day, topped up if cards are added or deleted
function daily() {
  let d = db.daily;
  if (!d || d.date !== todayStr()) d = db.daily = { date: todayStr(), ids: [], known: [] };
  d.ids = d.ids.filter(id => card(id));
  d.known = d.known.filter(id => d.ids.includes(id));
  if (d.ids.length < DAILY_SIZE) {
    const have = new Set(d.ids);
    d.ids.push(...weakestFirst(db.cards.filter(c => !have.has(c.id))).slice(0, DAILY_SIZE - d.ids.length).map(c => c.id));
  }
  if (d.ids.length && !db.streak.since) db.streak.since = d.date; // missed days count from the first challenge
  if (d.ids.length && d.known.length >= d.ids.length && !db.streak.done.includes(d.date)) db.streak.done.push(d.date);
  return d;
}

/* ---------- streak: consecutive days with a finished daily challenge ---------- */
const STREAK_GOALS = [3, 7, 14, 30, 60, 100, 200, 365];
const addDays = (day, n) => { const [y, m, d] = day.split('-').map(Number); return new Date(y, m - 1, d + n).toLocaleDateString('sv'); };
const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / DAY);

function streakInfo() {
  const today = todayStr(), done = new Set(db.streak.done), sorted = [...done].sort();
  const doneToday = done.has(today), last = sorted[sorted.length - 1] ?? null;
  // Missed = whole days since the last finished challenge (or since the first one was offered)
  const ref = last ?? (db.streak.since ? addDays(db.streak.since, -1) : today);
  const missed = doneToday ? 0 : Math.max(0, dayDiff(ref, today) - 1);
  let streak = 0;
  for (let d = doneToday ? today : addDays(today, -1); done.has(d); d = addDays(d, -1)) streak++;
  let best = 0, run = 0;
  sorted.forEach((d, i) => { run = i && dayDiff(sorted[i - 1], d) === 1 ? run + 1 : 1; best = Math.max(best, run); });
  return { streak, best, missed, doneToday, dead: missed >= 3, deathKey: ref };
}

// Called when the last word of today's challenge becomes known
function completeDaily() {
  const today = todayStr();
  if (db.streak.done.includes(today)) return;
  const before = streakInfo();
  db.streak.done.push(today);
  if (before.dead) db.streak.revivedOn = today;
  state.celebrate = { from: before.streak, to: streakInfo().streak, revived: before.dead };
}

function dueLabel(c) {
  if (c.reps === 0 && c.lapses === 0) return 'new';
  if (isDue(c)) return 'due';
  const d = relDays(c.due);
  return d <= 1 ? 'tomorrow' : 'in ' + fmtDays(d);
}

/* ---------- parsing lists & CSV ---------- */
const SEPS = { tab: '\t', dash: ' - ', colon: ':', semicolon: ';', comma: ',', equals: '=' };
const AUTO_SEPS = ['\t', ' - ', ' – ', ' — ', ' = ', ': ', ':', ';', ','];

function parseLines(text, sep) {
  const pairs = []; let bad = 0;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const seps = sep === 'auto' ? AUTO_SEPS : [SEPS[sep]];
    let pair = null;
    for (const s of seps) {
      const i = line.indexOf(s);
      if (i > 0) { pair = [line.slice(0, i).trim(), line.slice(i + s.length).trim()]; break; }
    }
    if (pair && pair[0] && pair[1]) pairs.push(pair); else bad++;
  }
  return { pairs, bad };
}

function parseCSV(text) {
  const first = text.split('\n')[0];
  const delim = first.split(';').length > first.split(',').length ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(f); f = ''; }
    else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (ch !== '\r') f += ch;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  const clean = s => s.replace(/[\t\r\n]+/g, ' ').trim();
  let out = rows.filter(r => r.length >= 2 && clean(r[0]) && clean(r[1])).map(r => [clean(r[0]), clean(r[1])]);
  if (out.length && /^(word|term|front|question|wort|mot|palabra)$/i.test(out[0][0])) out = out.slice(1);
  return out;
}

const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sizeCls(t) { const n = t.length; return n > 220 ? 'xs' : n > 80 ? 'sm' : n > 24 ? 'md' : ''; }

// [key, label, times a card was rated that way]; old 'Again' answers count as Hard
const RATED = [['hard', 'Hard', c => c.r[0] + c.r[1]], ['good', 'Good', c => c.r[2]], ['easy', 'Easy', c => c.r[3]]];

function ratedListHTML(cs) {
  const [, label, n] = RATED.find(([k]) => k === state.statFilter);
  const ws = cs.filter(c => n(c) > 0).sort((a, b) => n(b) - n(a) || a.front.localeCompare(b.front));
  return `<h3>Words rated ${label} (${ws.length})</h3>` + (ws.length
    ? `<ul class="word-list scroll">${ws.map(c => `<li><span><span class="w">${esc(c.front)}</span> <span class="d">${esc(c.back)}</span></span>
        <span class="n">${n(c)}×</span></li>`).join('')}</ul>`
    : `<p class="muted small">No words rated ${label} yet.</p>`);
}

function resultsHTML(cs) {
  const L = db.log[state.deckId] || {}, tot = [0, 0, 0, 0];
  cs.forEach(c => c.r.forEach((x, i) => tot[i] += x)); // totals from the cards, so they match the word lists
  const all = sum(tot), weak = troubleCards(cs), cap = Math.max(1, Math.round(cs.length * 0.05));
  if (!all && !weak.length) return `
    <section class="panel"><h2>Your results</h2>
      <p class="muted small">No answers yet. Your results show up here once you study this deck. Reviews, the daily challenge and random tests all count.</p></section>`;
  const days = [...Array(14)].map((_, k) => {
    const t = new Date(); t.setDate(t.getDate() - 13 + k);
    return { t, a: L[t.toLocaleDateString('sv')] || [0, 0, 0, 0] };
  });
  const max = Math.max(1, ...days.map(d => sum(d.a)));
  const tip = ({ t, a }) => `${t.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' })}: ` + (sum(a)
    ? `${plural(sum(a), 'answer')} · ${a[2] + a[3]} right, ${a[0] + a[1]} missed (Hard ${a[0] + a[1]}, Good ${a[2]}, Easy ${a[3]})`
    : 'no answers');
  const bar = d => {
    const right = d.a[2] + d.a[3], miss = d.a[0] + d.a[1];
    return `<div class="day" tabindex="0" data-tip="${esc(tip(d))}"><div class="bar" style="height:${sum(d.a) / max * 100}%">
      ${right ? `<i class="seg right" style="flex:${right}"></i>` : ''}${miss ? `<i class="seg miss" style="flex:${miss}"></i>` : ''}</div></div>`;
  };
  return `
    <section class="panel">
      <div class="panel-head"><h2>Your results</h2>
        <span class="muted small">${all ? `${Math.round((tot[2] + tot[3]) / all * 100)}% right · ${plural(all, 'answer')}` : ''}</span></div>
      <div class="stats">
        ${RATED.map(([k, label, n]) => `<button data-action="stat-filter" data-k="${k}" aria-pressed="${state.statFilter === k}"
          title="Show the words you rated ${label}"><b>${sum(cs.map(n))}</b><span class="rt ${k}">${label}</span></button>`).join('')}
      </div>
      ${state.statFilter ? ratedListHTML(cs) : '<p class="muted small">Click Hard, Good or Easy to see those words.</p>'}
      <div class="legend muted small"><span><i class="sw right"></i>Right (Good, Easy)</span><span><i class="sw miss"></i>Missed (Hard)</span></div>
      <div class="chart" role="img" aria-label="Answers per day, last 14 days">${days.map(bar).join('')}</div>
      <div class="chart-x muted small"><span>2 weeks ago</span><span>Today</span></div>
      <p id="day-readout" class="muted small">${esc(tip(days[13]))}</p>

      <h3>Words you keep missing</h3>
      ${weak.length ? `
        <ul class="word-list">${weak.map(c => `<li><span><span class="w">${esc(c.front)}</span> <span class="d">${esc(c.back)}</span></span>
          <span class="n">missed ${c.r[0] + c.r[1]} of ${sum(c.r)}</span></li>`).join('')}</ul>
        <button class="btn small" data-action="study-weak">Practise ${weak.length > 1 ? `these ${weak.length}` : 'this word'}</button>`
      : `<p class="muted small">None right now. A word shows up here (up to ${plural(cap, 'word')}, 5% of this deck) when you miss it more often than you get it right.</p>`}
    </section>`;
}

const rated = s => s.mode !== 'browse';

function studyHTML() {
  const s = state.study, d = deck(state.deckId), home = s.from === 'home';
  const left = s.queue.length - s.i + s.skipped.length;
  const dl = s.mode === 'daily' ? daily() : null;
  const info = s.mode === 'browse' ? `${s.i + 1} / ${s.queue.length}`
    : s.mode === 'exam' ? `Exam mode · round ${s.round} · ${left} left` + (s.skipped.length ? ` · ${s.skipped.length} skipped` : '')
    : (dl ? `${dl.known.length} / ${dl.ids.length} known · ` : '') + `${left} left` + (s.skipped.length ? ` · ${s.skipped.length} skipped` : '');
  const nav = `<nav><button class="link" data-action="exit-study">← ${home ? 'All decks' : esc(d.name)}</button>
    <span class="muted small">${info}</span></nav>`;

  if (dl && s.i >= s.queue.length) return `${nav}<div class="done">
      <div class="big-emoji">🎉</div>
      <h1>${dl.known.length >= dl.ids.length ? 'Daily challenge complete!' : 'Session finished'}</h1>
      <p class="muted">You know ${dl.known.length} of today’s ${dl.ids.length} words. New words tomorrow.</p>
      <div class="actions"><button class="btn primary" data-action="exit-study">Back to all decks</button></div></div>`;

  if ((s.mode === 'random' || s.mode === 'weak') && s.i >= s.queue.length) return `${nav}<div class="done">
      <div class="big-emoji">🎉</div>
      <h1>${s.mode === 'weak' ? 'Practice finished' : 'Test finished'}</h1>
      <p class="muted">You answered ${plural(s.done, 'card')}${s.again ? `, with ${s.again} to practise again` : ''}.</p>
      <div class="actions">
        ${s.mode === 'random' ? `<button class="btn primary" data-action="study-random" data-n="${s.n}">Another ${s.n} cards</button>`
          : troubleCards(cardsOf(state.deckId)).length ? `<button class="btn primary" data-action="study-weak">Practise the missed words again</button>` : ''}
        <button class="btn" data-action="exit-study">Back to ${home ? 'all decks' : esc(d.name)}</button>
      </div></div>`;

  if (s.mode === 'review' && s.i >= s.queue.length) {
    const upcoming = cardsOf(d.id).map(c => c.due).filter(t => t > Date.now());
    const next = upcoming.length ? relDays(Math.min(...upcoming)) : null;
    return `${nav}<div class="done">
      <div class="big-emoji">🎉</div>
      <h1>Well done!</h1>
      <p class="muted">You reviewed ${plural(s.done, 'card')}${s.again ? `, with ${s.again} to practise again` : ''}.
      ${next !== null ? `<br>Next review ${next <= 1 ? 'tomorrow' : 'in ' + fmtDays(next)}.` : ''}</p>
      <div class="actions">
        <button class="btn primary" data-action="exit-study">Back to deck</button>
        <button class="btn" data-action="study-browse">Browse all cards</button>
      </div></div>`;
  }

  const c = card(s.queue[s.i]);
  const fw = db.settings.dir === 'fw';
  const q = fw ? c.front : c.back, a = fw ? c.back : c.front;
  const pct = rated(s) ? ((s.i - s.roundStart) / (s.queue.length - s.roundStart + s.skipped.length)) * 100 : ((s.i + 1) / s.queue.length) * 100;
  const from = home ? ` · ${esc(deck(c.deckId)?.name ?? '')}` : '';
  return `${nav}
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="flip" data-action="flip" tabindex="0" aria-label="Flashcard, press space to flip">
      <div class="flip-inner ${s.flipped ? 'flipped' : ''}">
        <div class="face front"><span class="face-label">${fw ? 'Word' : 'Definition'}${from}</span>
          <div class="face-text ${sizeCls(q)}">${esc(q)}</div><span class="hint">Tap to flip</span></div>
        <div class="face back"><span class="face-label">${fw ? 'Definition' : 'Word'}${from}</span>
          <div class="face-text ${sizeCls(a)}">${esc(a)}</div></div>
      </div>
    </div>
    <div id="controls">${controlsHTML()}</div>`;
}

function controlsHTML() {
  const s = state.study;
  if (s.mode === 'browse') return `
    <div class="controls">
      <button class="btn" data-action="prev">← Prev</button>
      <button class="btn" data-action="shuffle">Shuffle</button>
      <button class="btn primary" data-action="next">Next →</button>
    </div>
    <p class="keys muted small">Space = flip · ← → = previous / next</p>`;
  if (!s.flipped) return `
    <div class="controls">
      <button class="btn" data-action="skip">Skip</button>
      <button class="btn primary" data-action="flip">Show answer</button>
    </div>
    <p class="keys muted small">Space = show answer · S = skip (skipped cards come back at the end)</p>`;
  const c = card(s.queue[s.i]);
  // Review shows when the card comes back; practice modes don't touch the schedule
  const iv = s.mode === 'review' ? r => ['', 'again soon', 'tomorrow', 'in 3 days'][r]
    : s.mode === 'daily' ? r => ['', 'again soon', 'known ✓', 'known ✓'][r]
    : s.mode === 'exam' ? r => ['', 'no effect', 'no effect', 'no effect'][r]
    : r => ['', 'again soon', 'got it', 'got it'][r];
  return `
    <div class="rate">
      <button class="btn hard" data-action="rate" data-r="1">Hard<small>${iv(1)}</small></button>
      <button class="btn good" data-action="rate" data-r="2">Good<small>${iv(2)}</small></button>
      <button class="btn easy" data-action="rate" data-r="3">Easy<small>${iv(3)}</small></button>
    </div>
    <div class="skip-row"><button class="link" data-action="skip">Skip for now</button></div>
    <p class="keys muted small">Keys 1–3 to rate · S = skip${s.mode === 'exam' ? ' · every word keeps coming back, round after round' : ' · Hard = see it again in this session'}</p>`;
}

/* ---------- actions ---------- */
// mode: 'review' / 'browse' / 'weak' / 'exam' (one deck) · 'daily' / 'random' (all decks). Only 'review' changes the schedule
function startStudy(mode, n) {
  let queue, from = 'deck';
  if (mode === 'review') queue = shuffle(cardsOf(state.deckId).filter(c => isDue(c)).map(c => c.id));
  else if (mode === 'browse') queue = cardsOf(state.deckId).map(c => c.id);
  else if (mode === 'exam') queue = examRound();
  else if (mode === 'weak') queue = shuffle(troubleCards(cardsOf(state.deckId)).map(c => c.id));
  else if (mode === 'random') { queue = shuffle(db.cards.map(c => c.id)).slice(0, n); from = 'home'; }
  else { const d = daily(); save(); queue = shuffle(d.ids.filter(id => !d.known.includes(id))); from = 'home'; }
  if (!queue.length) return;
  state.study = { mode, from, n, queue, i: 0, flipped: false, done: 0, again: 0, skipped: [], round: 1, roundStart: 0 };
  state.view = 'study';
  render();
}

function flip() {
  const s = state.study;
  if (!s || (rated(s) && s.i >= s.queue.length)) return;
  s.flipped = !s.flipped;
  $('.flip-inner').classList.toggle('flipped', s.flipped);
  $('#controls').innerHTML = controlsHTML();
}

function move(step) {
  const s = state.study, n = s.queue.length;
  s.i = (s.i + step + n) % n; s.flipped = false;
  render();
}

function rate(r) {
  const s = state.study, c = card(s.queue[s.i]);
  if (s.mode === 'exam') return advance(); // exam mode: ratings change nothing
  if (s.mode === 'review') schedule(c, r);
  record(c, r);
  if (s.mode === 'daily' && r >= 2) {
    const d = daily(); if (!d.known.includes(c.id)) d.known.push(c.id);
    if (d.known.length >= d.ids.length) completeDaily();
  }
  save();
  s.done++;
  if (r <= 1) { s.again++; s.queue.splice(Math.min(s.i + 4, s.queue.length), 0, c.id); } // Hard: comes back a few cards later
  advance();
}

function skip() {
  const s = state.study;
  if (!s || !rated(s) || s.i >= s.queue.length) return;
  s.skipped.push(s.queue[s.i]);
  advance();
}

// Next card; when the queue runs out, the skipped cards come back. Exam mode then starts a new round
function advance() {
  const s = state.study;
  s.i++; s.flipped = false;
  if (s.i >= s.queue.length && s.skipped.length) {
    toast(`Back to the ${plural(s.skipped.length, 'card')} you skipped`);
    s.queue.push(...s.skipped); s.skipped = [];
  } else if (s.i >= s.queue.length && s.mode === 'exam') {
    const next = examRound(s.queue[s.i - 1]);
    if (next.length) { s.queue.push(...next); s.roundStart = s.i; s.round++; toast(`Round ${s.round}: all words again`); }
  }
  render();
}

// Every word in the deck, shuffled, not starting with the word just shown
function examRound(last) {
  const ids = shuffle(cardsOf(state.deckId).map(c => c.id));
  if (ids.length > 1 && ids[0] === last) ids.push(ids.shift());
  return ids;
}

function updatePreview() {
  const el = $('#bulk-preview'), ta = $('#bulk');
  if (!el || !ta) return;
  if (!ta.value.trim()) { el.textContent = ''; return; }
  const { pairs, bad } = parseLines(ta.value, state.sep);
  el.textContent = `${plural(pairs.length, 'card')} found` + (bad ? ` · ${plural(bad, 'line')} not understood` : '');
}

function applySearch() {
  const q = state.search.trim().toLowerCase();
  document.querySelectorAll('.card-row[data-search]').forEach(r => r.classList.toggle('hidden', !!q && !r.dataset.search.includes(q)));
}

function bulkAdd() {
  const { pairs } = parseLines($('#bulk').value, state.sep);
  if (!pairs.length) { toast('No cards found. Check the separator.'); return; }
  const existing = new Set(cardsOf(state.deckId).map(c => c.front.trim().toLowerCase()));
  let added = 0, skipped = 0;
  for (const [f, b] of pairs) {
    const k = f.toLowerCase();
    if (existing.has(k)) { skipped++; continue; }
    existing.add(k); db.cards.push(newCard(state.deckId, f, b)); added++;
  }
  save();
  state.bulkText = '';
  render();
  toast(`Added ${plural(added, 'card')}` + (skipped ? `, skipped ${plural(skipped, 'duplicate')}` : ''));
}

function exportData() {
  const data = { app: 'elena-flashcards', version: 1, exported: new Date().toISOString(), ...db };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `elena-flashcards-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup downloaded');
}

async function importData(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.decks) || !Array.isArray(data.cards)) throw new Error();
    const deckIds = new Set(db.decks.map(d => d.id)), cardIds = new Set(db.cards.map(c => c.id));
    let nd = 0, nc = 0;
    for (const d of data.decks) {
      if (d && d.id && !deckIds.has(String(d.id))) {
        db.decks.push({ id: String(d.id), name: String(d.name || 'Untitled'), created: +d.created || Date.now() });
        deckIds.add(String(d.id)); nd++;
      }
    }
    for (const c of data.cards) {
      if (c && c.id && !cardIds.has(String(c.id)) && deckIds.has(String(c.deckId))) {
        db.cards.push(normCard(c)); cardIds.add(String(c.id)); nc++;
      }
    }
    save(); render();
    toast(`Imported ${plural(nd, 'deck')} and ${plural(nc, 'card')}`);
  } catch (e) { toast('That file is not a valid flashcards backup'); }
}

function exitStudy() {
  state.view = state.study?.from === 'home' ? 'home' : 'deck'; state.study = null;
  render(); window.scrollTo(0, 0);
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  const d = deck(state.deckId);
  switch (a) {
    case 'home': state.view = 'home'; state.search = ''; state.editingId = null; render(); break;
    case 'open-deck': state.view = 'deck'; state.deckId = id; state.search = ''; state.editingId = null; state.statFilter = null; render(); window.scrollTo(0, 0); break;
    case 'export': exportData(); break;
    case 'import': $('#file-json').click(); break;
    case 'rename-deck': {
      const name = prompt('New name for this deck:', d.name);
      if (name && name.trim()) { d.name = name.trim().slice(0, 80); save(); render(); }
      break;
    }
    case 'delete-deck': {
      const n = cardsOf(d.id).length;
      if (confirm(`Delete “${d.name}” and its ${plural(n, 'card')}? This cannot be undone.`)) {
        db.cards = db.cards.filter(c => c.deckId !== d.id);
        db.decks = db.decks.filter(x => x.id !== d.id);
        delete db.log[d.id];
        save(); state.view = 'home'; render(); toast('Deck deleted');
      }
      break;
    }
    case 'edit-card': state.editingId = id; state.edit = null; render(); { const f = app.querySelector('[data-form="edit-card"] input'); f && f.focus(); } break;
    case 'cancel-edit': state.editingId = null; state.edit = null; render(); break;
    case 'delete-card': {
      const c = card(id);
      if (confirm(`Delete the card “${c.front}”?`)) { db.cards = db.cards.filter(x => x.id !== id); save(); render(); }
      break;
    }
    case 'pick-file': $('#file-list').click(); break;
    case 'bulk-add': bulkAdd(); break;
    case 'study-review': startStudy('review'); break;
    case 'study-browse': startStudy('browse'); break;
    case 'exit-study': exitStudy(); break;
    case 'study-daily': startStudy('daily'); break;
    case 'stat-filter': state.statFilter = state.statFilter === el.dataset.k ? null : el.dataset.k; render(); break;
    case 'close-celebrate': state.celebrate = null; render(); break;
    case 'reset-daily':
      if (confirm('Start today’s daily challenge over with a new set of words?')) {
        db.daily = null; daily(); save(); render(); toast('Daily challenge reset');
      }
      break;
    case 'study-random': startStudy('random', +el.dataset.n); break;
    case 'skip': skip(); break;
    case 'study-weak': startStudy('weak'); break;
    case 'study-exam': startStudy('exam'); break;
    case 'flip': flip(); break;
    case 'prev': move(-1); break;
    case 'next': move(1); break;
    case 'shuffle': shuffle(state.study.queue); state.study.i = 0; state.study.flipped = false; render(); toast('Shuffled'); break;
    case 'rate': rate(+el.dataset.r); break;
  }
});

app.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form;
  if (kind === 'new-deck') {
    const name = f.deckname.value.trim();
    if (!name) return;
    const d = { id: uid(), name: name.slice(0, 80), created: Date.now() };
    db.decks.push(d); save();
    state.view = 'deck'; state.deckId = d.id; render();
    app.querySelector('[data-form="add-card"] input').focus();
  } else if (kind === 'add-card') {
    const front = f.front.value.trim(), back = f.back.value.trim();
    if (!front || !back) return;
    const dup = cardsOf(state.deckId).some(c => c.front.trim().toLowerCase() === front.toLowerCase());
    if (dup && !confirm(`“${front}” is already in this deck. Add it anyway?`)) return;
    db.cards.push(newCard(state.deckId, front, back)); save();
    state.add = { front: '', back: '' };
    render();
    app.querySelector('[data-form="add-card"] input').focus();
    toast('Card added');
  } else if (kind === 'edit-card') {
    const c = card(f.dataset.id), front = f.front.value.trim(), back = f.back.value.trim();
    if (!front || !back) return;
    c.front = front; c.back = back; save();
    state.editingId = null; state.edit = null; render();
  }
});

const showDay = e => { const el = e.target.closest?.('.day'); if (el) $('#day-readout').textContent = el.dataset.tip; };
app.addEventListener('mouseover', showDay);
app.addEventListener('focusin', showDay);

app.addEventListener('input', e => {
  if (e.target.id === 'bulk') { state.bulkText = e.target.value; updatePreview(); }
  if (e.target.id === 'search') { state.search = e.target.value; applySearch(); }
  const f = e.target.form;
  if (f?.dataset.form === 'add-card') state.add[e.target.name] = e.target.value;
  if (f?.dataset.form === 'edit-card') state.edit = { id: f.dataset.id, front: f.front.value, back: f.back.value };
});

app.addEventListener('change', e => {
  if (e.target.dataset.setting === 'dir') { db.settings.dir = e.target.value; save(); }
  if (e.target.id === 'sep') { state.sep = e.target.value; updatePreview(); }
});

app.addEventListener('toggle', e => {
  if (e.target.matches('[data-bulk]')) state.bulkOpen = e.target.open;
  if (e.target.matches('[data-daily-words]')) state.dailyOpen = e.target.open;
}, true);

// Enter in a definition box submits the form (Shift+Enter = new line)
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.matches('form textarea')) {
    e.preventDefault(); e.target.form.requestSubmit();
  }
});

document.addEventListener('keydown', e => {
  if (state.celebrate) { if (e.key === 'Escape') { state.celebrate = null; render(); } return; }
  if (state.view !== 'study' || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target instanceof Element ? e.target : document.body;
  if (t.matches('input, textarea, select')) return;
  const s = state.study;
  if (e.key === 'Escape') { exitStudy(); return; }
  if (e.key.toLowerCase() === 's' && rated(s)) { skip(); return; }
  if ((e.key === ' ' || e.key === 'Enter') && !t.matches('button')) { e.preventDefault(); flip(); return; }
  if (s.mode === 'browse') {
    if (e.key === 'ArrowRight') move(1);
    if (e.key === 'ArrowLeft') move(-1);
  } else if (s.flipped && s.i < s.queue.length && ['1', '2', '3'].includes(e.key)) {
    rate(+e.key);
  }
});

$('#file-json').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (f) importData(f);
});

$('#file-list').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const text = await f.text();
  if (/\.csv$/i.test(f.name)) {
    const rows = parseCSV(text);
    state.bulkText = rows.map(r => r.join('\t')).join('\n');
    state.sep = 'tab';
  } else {
    state.bulkText = text; state.sep = 'auto';
  }
  state.bulkOpen = true;
  render();
  toast('File loaded. Check the preview, then press “Add cards”.');
});

/* ---------- saving: every 3 min, when the tab is hidden or closed, and on demand ---------- */
$('#save-now').addEventListener('click', () => saveAll(true));
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveAll(true); }
});
setInterval(() => saveAll(), AUTOSAVE_MS);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveAll(); });
window.addEventListener('pagehide', () => saveAll());
// Another tab saved: take its data, so this tab doesn't overwrite it with an old copy
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  load();
  if (state.study) {
    const s = state.study, cur = s.queue[s.i];
    s.queue = s.queue.filter(id => card(id)); s.skipped = s.skipped.filter(id => card(id));
    s.i = Math.max(0, cur && card(cur) ? s.queue.indexOf(cur) : Math.min(s.i, s.queue.length));
    if (!s.queue.length) state.view = s.from === 'home' ? 'home' : 'deck';
  }
  render();
});
// Ask the browser not to clear our storage when disk space runs low
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});

load();
loadDraft();
render();
</script>
</body>
</html>
